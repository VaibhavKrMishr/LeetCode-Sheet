<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.85"/>

  <!-- Subtle Grid Accent Lines in Background -->
  <path d="M 24 160 L 488 160 M 24 256 L 488 256 M 24 352 L 488 352" stroke="#21262d" stroke-width="2" opacity="0.4"/>
  <path d="M 160 24 L 160 488 M 256 24 L 256 488 M 352 24 L 352 488" stroke="#21262d" stroke-width="2" opacity="0.4"/>

  <!-- Code Glyphs: < / > -->
  <g filter="url(#glow)">
    <!-- Left Bracket: < -->
    <path d="M 195 160 L 95 256 L 195 352" fill="none" stroke="url(#bracketGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Middle Slash: / -->
    <path d="M 285 140 L 227 372" fill="none" stroke="url(#slashGrad)" stroke-width="34" stroke-linecap="round"/>

    <!-- Right Bracket: > -->
    <path d="M 317 160 L 417 256 L 317 352" fill="none" stroke="url(#bracketGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent Indicator Dots (Easy, Med, Hard) -->
  <circle cx="160" cy="425" r="14" fill="#10b981"/>
  <circle cx="256" cy="425" r="14" fill="#f59e0b"/>
  <circle cx="352" cy="425" r="14" fill="#ef4444"/>
</svg>
